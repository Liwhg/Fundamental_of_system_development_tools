repos:
  - repo: local
    hooks:
      - id: practice-ruff-check
        name: Practice Ruff check
        entry: python -m ruff check
        language: system
        types: [python]
        files: ^practice-package/(src|tests)/

      - id: practice-ruff-format
        name: Practice Ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
        files: ^practice-package/(src|tests)/
